name: ore
description: "Ore Customer App — the customer-facing super app for food, groceries, market, shop, pharmacy, laundry, parcel and errand delivery."
publish_to: "none"
version: 1.0.0+1  # prod release candidate; bump +N on every public build

environment:
  sdk: ^3.11.1

dependencies:
  google_fonts: ^6.1.0
  flutter_iconly: ^1.0.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_map: ^8.2.2
  geolocator: ^10.1.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  file_picker: ^8.1.2
  flutter_rating_bar: ^4.0.1
  uuid: ^4.5.1
  go_router: ^14.6.2
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  flutter_slidable: ^4.0.0
  skeletonizer: ^2.1.3
  another_flushbar: ^1.12.30
  ore_core:
    path: ../../packages/ore_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0
  test_api: ^0.7.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/home/
    - assets/images/products/
    - assets/images/profile/
    - assets/images/promo/
    - assets/images/services/
    - assets/images/vendors/
    - assets/icons/
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: ttf/Inter-Thin.ttf
          weight: 100
        - asset: ttf/Inter-ExtraLight.ttf
          weight: 200
        - asset: ttf/Inter-Light.ttf
          weight: 300
        - asset: ttf/Inter-Regular.ttf
          weight: 400
        - asset: ttf/Inter-Medium.ttf
          weight: 500
        - asset: ttf/Inter-SemiBold.ttf
          weight: 600
        - asset: ttf/Inter-Bold.ttf
          weight: 700
        - asset: ttf/Inter-ExtraBold.ttf
          weight: 800
        - asset: ttf/Inter-Black.ttf
          weight: 900
        - asset: ttf/Inter-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: ttf/Inter-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: ttf/Inter-LightItalic.ttf
          weight: 300
          style: italic
        - asset: ttf/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: ttf/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: ttf/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: ttf/Inter-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: ttf/Inter-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: ttf/Inter-BlackItalic.ttf
          weight: 900
          style: italic
