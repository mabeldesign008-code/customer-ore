# ============================================================================
# Ore Delivery — compose stack.
#
# Audit S-2 hardening. The previous file published Postgres (hardcoded ore/ore),
# Redis (no auth), NATS (no auth, incl. its monitoring port) and all 13 internal
# services to the HOST on their default ports. On any VPS without an external
# firewall that was: a full SQL dump of the ledger, a flushable cache/rate-limit
# store, an event bus anyone could publish forged `charge_succeeded` to, and
# direct unauthenticated-gateway access to every internal API (including
# money-out). Now:
#   - infra ports bind to 127.0.0.1 only (host tooling like `pnpm dev` still
#     works; the internet does not),
#   - credentials come from the environment with `:?err` — compose REFUSES to
#     start with them unset, so there is no hardcoded-default to forget,
#   - Redis has requirepass, NATS has user/pass auth,
#   - internal services publish NO host ports at all — the gateway (4000) is
#     the only entry point, and it is the layer that enforces edge guards.
#
# Full mode: docker compose up --build -d
# Light mode: docker compose up -d postgres redis nats && pnpm dev
# ============================================================================
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ore}
      # No default. Compose fails fast if the operator has not set one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (no default — audit S-2)}
      POSTGRES_DB: ${POSTGRES_DB:-oredelivery}
    ports:
      # Loopback-only: reachable from this host (psql, migrations, `pnpm dev`),
      # never from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - ore_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1G }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ore} -d ${POSTGRES_DB:-oredelivery}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ore-redis
    # Audit S-2: an unauthenticated Redis was published to the host — it holds
    # rate-limit counters, dedupe keys and the outbox relay state. requirepass
    # is now mandatory.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD must be set (no default — audit S-2)}']
    ports:
      - '127.0.0.1:6379:6379'
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  nats:
    image: nats:2.10-alpine
    container_name: ore-nats
    # Audit S-1/S-2: the bus was open to anyone who could reach 4222 — forged
    # charge_succeeded / order.delivered events were a one-liner. JetStream auth
    # is now required, matching NATS_USER/NATS_PASS that loadEnv enforces in
    # production (NatsBus refuses to connect without credentials there).
    command: ['-js', '-sd', '/data', '--user', '${NATS_USER:?NATS_USER must be set (no default — audit S-2)}', '--pass', '${NATS_PASS:?NATS_PASS must be set (no default — audit S-2)}', '--http_port', '8222']
    ports:
      - '127.0.0.1:4222:4222'
      # Monitoring port: loopback-only. It leaked connection lists and stats.
      - '127.0.0.1:8222:8222'
    volumes:
      - ore_natsdata:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Services ──────────────────────────────────────────────────────
  # Full mode: docker compose up --build -d
  # Light mode: docker compose up -d postgres redis nats && pnpm dev

  gateway:
    build: { context: ., args: { APP: gateway } }
    environment: &svc-env
      NODE_ENV: development
      ORCHESTRATION: distributed
      DATABASE_URL: postgres://${POSTGRES_USER:-ore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oredelivery}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_USER}
      NATS_PASS: ${NATS_PASS}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_MODE: mock
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      WHAT3WORDS_API_KEY: ${WHAT3WORDS_API_KEY}
      GHANA_GPS_API_KEY: ${GHANA_GPS_API_KEY}
      GEOCODER_MODE: ${GEOCODER_MODE:-live}
      GEOCODER_OSM_FALLBACK: ${GEOCODER_OSM_FALLBACK:-true}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      AUTH_OTP_LOG: 'false'
      # Secrets Manager — set USE_SECRETS_MANAGER=true in production to pull
      # all secrets from AWS instead of environment variables above.
      USE_SECRETS_MANAGER: ${USE_SECRETS_MANAGER:-false}
      SECRETS_MANAGER_SECRET_ID: ${SECRETS_MANAGER_SECRET_ID:-ore-delivery/production}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # In-network service discovery (audit S-2): serviceUrl() defaults to
      # 127.0.0.1:<port>, which only ever worked because every service was
      # published to the host. With host ports removed, containers resolve each
      # other by compose DNS name instead.
      GATEWAY_URL: http://gateway:4000
      AUTH_URL: http://auth-service:4100
      CATALOG_URL: http://catalog-service:4101
      CART_URL: http://cart-service:4102
      ORDER_URL: http://order-service:4103
      PAYMENT_URL: http://payment-service:4104
      DISPATCH_URL: http://dispatch-service:4105
      TRACKING_URL: http://tracking-service:4106
      NOTIFICATION_URL: http://notification-service:4107
      LEDGER_URL: http://ledger-service:4108
      ONBOARDING_URL: http://onboarding-service:4109
      REFERRAL_URL: http://referral:4110
      COMMS_URL: http://comms-service:4111
    ports: ['4000:4000']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  # Internal services: NO published ports (audit S-2). They talk to each other
  # and to infra over the compose network; the gateway is the only way in.
  referral:
    build:
      context: .
      args: { APP: referral }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    # No host port: internal service, reached only through the gateway.

  auth-service:
    build: { context: ., args: { APP: auth } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  catalog-service:
    build: { context: ., args: { APP: catalog } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  cart-service:
    build: { context: ., args: { APP: cart } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  order-service:
    build: { context: ., args: { APP: order } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  payment-service:
    build: { context: ., args: { APP: payment } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  dispatch-service:
    build: { context: ., args: { APP: dispatch } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  tracking-service:
    build: { context: ., args: { APP: tracking } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  notification-service:
    build: { context: ., args: { APP: notification } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  ledger-service:
    build: { context: ., args: { APP: ledger } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  onboarding-service:
    build: { context: ., args: { APP: onboarding } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  comms-service:
    build: { context: ., args: { APP: comms } }
    environment: *svc-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  ore_pgdata:
  ore_natsdata:
