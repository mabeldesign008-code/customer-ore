name: ore_core
description: Shared models, theme, widgets, networking and motion primitives for the Ore super-app (customer / vendor / rider).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  google_fonts: ^6.1.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.7.0
  dio_cache_interceptor: ^3.5.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.0
  flutter_animate: ^4.5.2
  socket_io_client: ^3.1.3
  url_launcher: ^6.3.1
  # Twilio Programmable Voice (mobile + web). Web builds also work through the
  # hand-rolled JS bridge in src/voice; the plugin covers Android/iOS/macOS.
  twilio_voice: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
